name: edge_detection
description: A Flutter plugin to detect edges of objects.
version: 1.1.3
homepage: https://github.com/GiantMonkey/flutter_edge_detection

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.0.0
  path_provider: ^2.0.11
  path: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.sample.edgedetection
        pluginClass: EdgeDetectionPlugin
      ios:
        pluginClass: EdgeDetectionPlugin
