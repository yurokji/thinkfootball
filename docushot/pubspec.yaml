name: docushot
description: A local-first document scanning application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1 # Using a known stable version roughly compatible with Hive/Flutter
  riverpod_annotation: ^2.3.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ML Kit
  google_mlkit_document_scanner: ^0.4.0
  google_mlkit_text_recognition: ^0.15.0

  # Utilities
  pdf: ^3.10.0
  share_plus: ^10.0.0
  gal: ^2.3.0
  archive: ^3.6.1
  path_provider: ^2.1.2
  uuid: ^4.3.3
  intl: ^0.20.2

  # UI
  reorderable_grid_view: ^2.2.5
  flutter_slidable: ^3.1.0
  cupertino_icons: ^1.0.6
  async: ^2.13.0
  image_picker: ^1.2.1
  camera: ^0.10.5
  image_cropper: ^8.0.2
  image: ^4.1.7 # For pixel-level manipulation (filters)
  edge_detection:
    path: packages/edge_detection
  sensors_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
